<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3D33" />
    <title>You're offline — BW Inventory</title>
    <style>
      /* Self-contained: this page is served from the service worker cache when
         the network is down, so nothing here may reference another file. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family:
          "IBM Plex Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #f6f4ec;
        color: #16201d;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        padding: 24px 16px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid #e7e4da;
        border-radius: 20px;
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(11, 61, 51, 0.08);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(160deg, #0e6b57 0%, #0a4e40 100%);
        color: #fff;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: -0.04em;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 22px;
        color: #4a554f;
        font-size: 14.5px;
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: #0e6b57;
        color: #fff;
        font: inherit;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 22px;
        width: 100%;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
      .hint {
        margin-top: 14px;
        font-size: 12.5px;
        color: #7c857f;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">BW</div>
      <h1>You're offline</h1>
      <p>
        BW Inventory needs a connection to load your shop's data. Check your network and try again.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <div class="hint">Nothing you saved earlier is lost.</div>
    </main>
    <script>
      addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
