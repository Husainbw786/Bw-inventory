name: Probe site (temporary diagnostic)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe which paths Cloudflare challenges
        run: |
          HOST=bwinventory.husainbw.in
          UA='Mozilla/5.0 (X11; Linux x86_64; rv:60.0) Gecko/20100101 Firefox/81.0'
          printf '%-6s %-6s %-12s %s\n' "code" "curlUA" "mitigated" "path"
          for p in / /privacy /offline /offline.html /manifest.json /manifest.webmanifest /manifest.js /manifest.txt \
                   /.well-known/assetlinks.json /.well-known/manifest.json /.well-known/does-not-exist.json /.well-known/x \
                   /icons/icon-192.png /icons/icon.svg /icons/nope.png /sw.js /assets/nope.js /robots.txt /favicon.ico /nope.json /nope.png; do
            code=$(curl -sS -A "$UA" -o /dev/null -D /tmp/h -w '%{http_code}' "https://$HOST$p" || echo 000)
            code2=$(curl -sS -o /dev/null -w '%{http_code}' "https://$HOST$p" || echo 000)
            mit=$(grep -i '^cf-mitigated' /tmp/h | tr -d '\r' | cut -d' ' -f2)
            printf '%-6s %-6s %-12s %s\n' "$code" "$code2" "${mit:--}" "$p"
          done
